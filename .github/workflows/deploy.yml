# GitHub Actions CI/CD for Namecheap Shared Hosting (Node.js App)

name: Deploy to Namecheap

on:
  push:
    branches:
      - main # Change to your branch name if different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match your local Node.js version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare Standalone Bundle
        run: |
          # Copy public folder to standalone
          cp -r public .next/standalone/
          # Copy static files to standalone/.next/
          cp -r .next/static .next/standalone/.next/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          local-dir: .next/standalone/
          state-name: .next-ftp-deploy-state.json
        